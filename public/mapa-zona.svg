<style>
.mz-park path{fill:#18210f}
.mz-station path{fill:#221e1a;stroke:rgba(244,238,227,.3);stroke-width:1}
.mz-foot path{fill:none;stroke:rgba(244,238,227,.16);stroke-width:.8;stroke-dasharray:3 3}
.mz-minor path{fill:none;stroke:rgba(244,238,227,.42);stroke-width:1.3;stroke-linecap:round}
.mz-major path{fill:none;stroke:#f4eee3;stroke-width:2.6;stroke-linecap:round}
.mz-home path{fill:none;stroke:#f6c230;stroke-width:4.5;stroke-linecap:round}
