.mz-label{font-size:15px;font-weight:500;fill:#b3a99b;letter-spacing:.04em;paint-order:stroke;stroke:#0d0b09;stroke-width:4px}
.mz-label--home{fill:#f6c230;font-weight:700}
.mz-poi circle{fill:#f4eee3}
.mz-poi text{font-size:16px;font-weight:600;fill:#f4eee3;paint-order:stroke;stroke:#0d0b09;stroke-width:4px}
.mz-pin-dot{fill:#f6c230;stroke:#0d0b09;stroke-width:3}
.mz-pin-pulse{fill:none;stroke:#f6c230;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:p 2.4s cubic-bezier(.16,1,.3,1) infinite}
.mz-pin-label{font-family:'League Gothic','Arial Narrow',Impact,sans-serif;font-size:40px;font-weight:700;fill:#f4eee3;paint-order:stroke;stroke:#0d0b09;stroke-width:6px}
@keyframes p{from{transform:scale(.6);opacity:1}to{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.mz-pin-pulse{animation:none}}
